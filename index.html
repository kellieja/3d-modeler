<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Replicas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d0d0d;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 40px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
        }
        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 760px;
        }
        a.card {
            flex: 1 1 300px;
            display: block;
            padding: 28px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: inherit;
            text-decoration: none;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
        }
        a.card:hover,
        a.card:focus-visible {
            border-color: #00e1ff;
            background: rgba(0,225,255,0.06);
            transform: translateY(-2px);
        }
        .card h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
    <h1>Flux Replicas</h1>
    <div class="cards">
        <a class="card" href="reel-flux/">
            <h2>Reel Flux</h2>
            <p>An endless image reel. Drag or scroll and the cards ripple with your speed.</p>
        </a>
        <a class="card" href="spiral-gallery/">
            <h2>3D Spiral Flux Gallery</h2>
            <p>Travel a 3D spiral of cards by dragging, scrolling or using the arrow keys. Click a card to open it.</p>
        </a>
    </div>
</body>
</html>
