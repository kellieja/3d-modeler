<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spiral Flux Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            cursor: grab;
            touch-action: none;
        }
        canvas.dragging {
            cursor: grabbing;
        }
        canvas.hovering {
            cursor: pointer;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            pointer-events: none;
        }
        .counter {
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
        }
        .counter strong {
            color: #00e1ff;
            font-weight: 600;
        }
        .toggle {
            pointer-events: auto;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.85);
            font: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
        }
        .toggle:hover, .toggle:focus-visible {
            background: rgba(0,225,255,0.15);
            border-color: rgba(0,225,255,0.6);
            outline: none;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        .lightbox {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 24px;
            background: rgba(5,5,5,0.88);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s;
        }
        .lightbox.open {
            opacity: 1;
            visibility: visible;
        }
        .lightbox img {
            max-width: min(90vw, 1080px);
            max-height: 75vh;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(0,225,255,0.25);
            transform: scale(0.92);
            transition: transform 0.25s ease;
        }
        .lightbox.open img {
            transform: scale(1);
        }
        .lightbox figcaption {
            font-size: 15px;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }
        .lightbox .close {
            position: absolute;
            top: 16px;
            right: 16px;
        }
        @media (max-width: 600px) {
            .hud { padding: 0 16px; }
            .instructions { font-size: 12px; }
        }
    </style>
</head>
<body>

    <canvas id="spiralCanvas"></canvas>
    <div class="hud">
        <div class="counter" id="counter"></div>
        <button class="toggle" id="autoToggle" type="button"></button>
    </div>
    <div class="instructions">Drag or scroll to travel the spiral · Arrow keys step · Click a card to open it</div>

    <figure class="lightbox" id="lightbox" aria-hidden="true">
        <button class="toggle close" id="lightboxClose" type="button">Close</button>
        <img id="lightboxImg" alt="">
        <figcaption id="lightboxCaption"></figcaption>
    </figure>

    <script>
        const canvas = document.getElementById('spiralCanvas');
        const ctx = canvas.getContext('2d');
        const counterEl = document.getElementById('counter');
        const autoToggle = document.getElementById('autoToggle');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');

        let width, height, dpr;

        // Gallery content: generated architecture-style placeholder cards, so the page works offline.
        // To use real photos, replace makePlaceholder() with Image objects and keep the same titles.
        const titles = [
            'Meridian', 'Atrium', 'Monolith', 'Cantilever',
            'Brutal Bloom', 'Glass Spine', 'Vault', 'Terrace',
            'Lantern', 'Colonnade', 'Skybridge', 'Facade',
            'Rotunda', 'Arcade', 'Pavilion', 'Obelisk'
        ];
        const palettes = [
            ['#0f2027', '#2c5364'], ['#3a1c71', '#d76d77'], ['#141e30', '#35577d'], ['#42275a', '#734b6d'],
            ['#1d4350', '#a43931'], ['#000428', '#004e92'], ['#232526', '#5e6266'], ['#134e5e', '#71b280'],
            ['#4b134f', '#c94b4b'], ['#1f1c2c', '#928dab'], ['#0b486b', '#f56217'], ['#16222a', '#3a6073'],
            ['#2b5876', '#4e4376'], ['#200122', '#6f0000'], ['#093028', '#237a57'], ['#283c86', '#45a247']
        ];

        // Small seeded RNG so every card looks the same on each load
        function mulberry32(seed) {
            return function () {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function makePlaceholder(index) {
            const W = 720, H = 480;
            const c = document.createElement('canvas');
            c.width = W;
            c.height = H;
            const g = c.getContext('2d');
            const rand = mulberry32(index * 9973 + 17);
            const [c1, c2] = palettes[index % palettes.length];

            // Sky gradient
            const sky = g.createLinearGradient(0, 0, W * 0.4, H);
            sky.addColorStop(0, c2);
            sky.addColorStop(1, c1);
            g.fillStyle = sky;
            g.fillRect(0, 0, W, H);

            // Sun / light source
            const sunX = W * (0.2 + rand() * 0.6), sunY = H * (0.15 + rand() * 0.25);
            const sun = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, 220);
            sun.addColorStop(0, 'rgba(255,240,220,0.85)');
            sun.addColorStop(0.15, 'rgba(255,220,180,0.35)');
            sun.addColorStop(1, 'rgba(255,220,180,0)');
            g.fillStyle = sun;
            g.fillRect(0, 0, W, H);

            // Skyline of towers, back layer lighter than front layer
            for (let layer = 0; layer < 2; layer++) {
                let x = -20;
                while (x < W) {
                    const bw = 40 + rand() * 90;
                    const bh = H * (0.25 + rand() * (layer ? 0.45 : 0.6));
                    g.fillStyle = layer ? 'rgba(5,8,12,0.85)' : 'rgba(255,255,255,0.12)';
                    g.fillRect(x, H - bh, bw, bh);

                    // Window grid
                    if (layer) {
                        g.fillStyle = 'rgba(255,230,170,0.35)';
                        for (let wy = H - bh + 14; wy < H - 10; wy += 18) {
                            for (let wx = x + 8; wx < x + bw - 10; wx += 14) {
                                if (rand() > 0.55) g.fillRect(wx, wy, 6, 8);
                            }
                        }
                    }
                    x += bw + (layer ? 6 : 14) + rand() * 20;
                }
            }

            // Architectural arc accent
            g.strokeStyle = 'rgba(255,255,255,0.25)';
            g.lineWidth = 2;
            g.beginPath();
            g.arc(W * rand(), H * 1.1, H * (0.6 + rand() * 0.4), Math.PI, Math.PI * 2);
            g.stroke();

            // Bottom shade for legible text
            const shade = g.createLinearGradient(0, H * 0.6, 0, H);
            shade.addColorStop(0, 'rgba(0,0,0,0)');
            shade.addColorStop(1, 'rgba(0,0,0,0.65)');
            g.fillStyle = shade;
            g.fillRect(0, 0, W, H);

            // Labels
            g.fillStyle = 'rgba(255,255,255,0.7)';
            g.font = '600 26px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
            g.fillText(String(index + 1).padStart(2, '0'), 32, 52);
            g.fillStyle = '#fff';
            g.font = '700 54px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
            g.fillText(titles[index], 32, H - 40);
            return c;
        }

        const images = titles.map((_, i) => makePlaceholder(i));
        const totalItems = images.length;

        // Spiral Configuration Parameters (sizes are recomputed from the viewport in resize())
        const config = {
            cardsPerTurn: 9,      // How many cards fit in one 360° wrap
            spiralRadius: 280,    // Width of the spiral cylinder
            turnHeight: 220,      // Vertical drop per complete 360° turn
            photoWidth: 180,      // Rendered width of images
            photoHeight: 120,     // Rendered height of images
            fov: 900,             // Perspective strength (larger = flatter), scaled to the radius in resize()
            tilt: 0.15,           // Camera vertical tilt angle skew
            backFade: 0.25,       // Opacity floor for cards in the background turn
            visibleTurns: 1.15,   // How far up/down the spiral to draw, in turns
            autoSpeed: 0.18,      // Auto-rotate speed in radians per second
            idleDelay: 2500       // ms of inactivity before auto-rotate resumes
        };
        const step = (Math.PI * 2) / config.cardsPerTurn;

        // Position along the helix, in radians. Card slot k is centred when rotation === k * step.
        let currentRotation = 0;
        let targetRotation = 0;
        let isDragging = false;
        let dragMoved = 0;
        let lastX = 0;
        let lastY = 0;
        let lastMoveTime = 0;
        let velocity = 0;
        let lastInteraction = 0;
        let wheelSnapTimer = null;
        let drawnItems = [];
        let lightboxOpen = false;

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let autoRotate = !reducedMotion;

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            config.spiralRadius = Math.min(width * 0.34, 420);
            config.photoWidth = Math.max(96, Math.min(width * 0.18, 220));
            config.photoHeight = config.photoWidth * (2 / 3);
            config.turnHeight = Math.max(200, height * 0.55);
            config.fov = config.spiralRadius * 3.2;
        }
        window.addEventListener('resize', resize);
        resize();

        const slotIndex = (k) => ((k % totalItems) + totalItems) % totalItems;
        const nearestSlot = (rotation) => Math.round(rotation / step);

        function snapTo(slot) {
            targetRotation = slot * step;
        }

        function touch() {
            lastInteraction = performance.now();
        }

        // Pointer interaction (mouse, touch and pen)
        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            dragMoved = 0;
            velocity = 0;
            lastX = e.clientX;
            lastY = e.clientY;
            lastMoveTime = performance.now();
            canvas.setPointerCapture(e.pointerId);
            canvas.classList.add('dragging');
            touch();
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging) {
                canvas.classList.toggle('hovering', !!hitTest(e.clientX, e.clientY));
                return;
            }
            const deltaX = e.clientX - lastX;
            const deltaY = e.clientY - lastY;
            dragMoved += Math.abs(deltaX) + Math.abs(deltaY);

            // Horizontal drag spins, vertical drag climbs; both move along the same helix
            const delta = (-deltaX - deltaY * 0.6) * 0.007;
            targetRotation += delta;

            const now = performance.now();
            const dt = Math.max(now - lastMoveTime, 1);
            velocity = delta / dt;
            lastMoveTime = now;
            lastX = e.clientX;
            lastY = e.clientY;
            touch();
        });

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            canvas.classList.remove('dragging');
            touch();

            if (dragMoved < 6) {
                handleClick(e.clientX, e.clientY);
                return;
            }
            // Throw with a little inertia, then settle on the nearest card
            const releaseAge = performance.now() - lastMoveTime;
            const throwDistance = releaseAge < 80 ? velocity * 180 : 0;
            snapTo(nearestSlot(targetRotation + throwDistance));
        }
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);

        // Wheel Interaction: scroll down travels down the spiral
        window.addEventListener('wheel', (e) => {
            if (lightboxOpen) return;
            e.preventDefault();
            targetRotation += e.deltaY * 0.002;
            touch();
            clearTimeout(wheelSnapTimer);
            wheelSnapTimer = setTimeout(() => snapTo(nearestSlot(targetRotation)), 160);
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (lightboxOpen) {
                if (e.key === 'Escape') closeLightbox();
                return;
            }
            if (e.target === autoToggle && (e.key === ' ' || e.key === 'Enter')) return;
            const current = nearestSlot(targetRotation);
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                snapTo(current + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                snapTo(current - 1);
            } else if (e.key === 'Enter') {
                openLightbox(slotIndex(current));
            } else if (e.key === ' ') {
                setAutoRotate(!autoRotate);
            } else {
                return;
            }
            e.preventDefault();
            touch();
        });

        function setAutoRotate(on) {
            autoRotate = on;
            autoToggle.textContent = on ? 'Pause' : 'Auto-rotate';
            autoToggle.setAttribute('aria-pressed', String(on));
            if (!on) snapTo(nearestSlot(targetRotation));
        }
        autoToggle.addEventListener('click', () => setAutoRotate(!autoRotate));
        setAutoRotate(autoRotate);

        function hitTest(x, y) {
            // Topmost card is drawn last, so search from the end
            for (let i = drawnItems.length - 1; i >= 0; i--) {
                const it = drawnItems[i];
                if (x >= it.left && x <= it.right && y >= it.top && y <= it.bottom) return it;
            }
            return null;
        }

        function handleClick(x, y) {
            const hit = hitTest(x, y);
            if (!hit) return;
            // Already centred: open it. Otherwise bring it round to the front first.
            if (Math.abs(hit.slot * step - currentRotation) < step * 0.25) {
                openLightbox(hit.index);
            } else {
                snapTo(hit.slot);
            }
        }

        function openLightbox(index) {
            lightboxImg.src = images[index].toDataURL('image/jpeg', 0.92);
            lightboxImg.alt = titles[index];
            lightboxCaption.textContent = `${String(index + 1).padStart(2, '0')} · ${titles[index]}`;
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            lightboxOpen = true;
            document.getElementById('lightboxClose').focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            lightboxOpen = false;
            touch();
        }
        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) closeLightbox();
        });

        // Main Loop
        let lastFrame = performance.now();
        function animate(now) {
            const dt = Math.min((now - lastFrame) / 1000, 0.05);
            lastFrame = now;

            const idle = now - lastInteraction > config.idleDelay;
            if (autoRotate && idle && !isDragging && !lightboxOpen) {
                targetRotation += config.autoSpeed * dt;
            }

            // Smooth easing interpolation (Inertia/Settling physics), frame-rate independent
            currentRotation += (targetRotation - currentRotation) * (1 - Math.pow(0.9, dt * 60));

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = '#0b0b0b';
            ctx.fillRect(0, 0, width, height);

            renderSpiral();
            updateCounter();

            requestAnimationFrame(animate);
        }

        function updateCounter() {
            const index = slotIndex(nearestSlot(currentRotation));
            counterEl.innerHTML = `<strong>${String(index + 1).padStart(2, '0')}</strong> / ${String(totalItems).padStart(2, '0')} · ${titles[index]}`;
        }

        function renderSpiral() {
            const centerX = width / 2;
            const centerY = height / 2;
            const range = Math.PI * 2 * config.visibleTurns;

            // The helix is endless: draw every slot within range of the current position, cycling through the images
            const firstSlot = Math.ceil((currentRotation - range) / step);
            const lastSlot = Math.floor((currentRotation + range) / step);
            let items = [];

            for (let k = firstSlot; k <= lastSlot; k++) {
                // Angle relative to the camera: 0 is dead centre front
                const angle = k * step - currentRotation;
                const sinA = Math.sin(angle);
                const cosA = Math.cos(angle);

                // 3D positions: x across, z depth (negative = toward the viewer), y down the helix
                const x3d = sinA * config.spiralRadius;
                const z3d = -cosA * config.spiralRadius;
                const y3d = (angle / (Math.PI * 2)) * config.turnHeight + x3d * config.tilt;

                // Perspective scaling calculations
                const scale = config.fov / (config.fov + z3d);

                // Fade cards as they move further up or down the spiral
                const turnDistance = Math.abs(angle) / (Math.PI * 2);
                const rangeFade = Math.min(1, Math.max(0, (config.visibleTurns - turnDistance) / 0.35));
                if (rangeFade <= 0) continue;

                // Smooth front/back fade: 1 at the front, backFade at the back
                const depthMix = (cosA + 1) / 2;
                const alpha = (config.backFade + (1 - config.backFade) * depthMix * depthMix) * rangeFade;

                items.push({
                    slot: k,
                    index: slotIndex(k),
                    x: centerX + x3d * scale,
                    y: centerY + y3d * scale,
                    scale,
                    z3d,
                    alpha,
                    // Cards sit tangent to the cylinder, so they narrow as they turn side-on
                    squash: Math.max(0.22, Math.abs(cosA)),
                    // Edge flare spikes at the extreme left/right profiles, where |sin| is near 1
                    edgeFactor: Math.abs(sinA),
                    isFrontRow: cosA >= 0
                });
            }

            // Painter's Algorithm: draw back-to-front (furthest z first)
            items.sort((a, b) => b.z3d - a.z3d);

            const w = config.photoWidth;
            const h = config.photoHeight;
            drawnItems = [];

            items.forEach(item => {
                const img = images[item.index];
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.scale(item.scale * item.squash, item.scale);
                ctx.globalAlpha = item.alpha;

                // HorizonX "Edge Treatment": flares, smears and colour fringes at the extreme visual bounds
                if (item.edgeFactor > 0.7) {
                    const intensity = (item.edgeFactor - 0.7) / 0.3; // normalise flare intensity 0 to 1
                    const fringe = 6 * intensity / item.squash;

                    // 1. Chromatic fringe: offset cyan and magenta ghosts behind the card
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.globalAlpha = item.alpha * 0.35 * intensity;
                    ctx.fillStyle = '#00e1ff';
                    ctx.beginPath();
                    ctx.roundRect(-w / 2 - fringe, -h / 2, w, h, 8);
                    ctx.fill();
                    ctx.fillStyle = '#ff2bd6';
                    ctx.beginPath();
                    ctx.roundRect(-w / 2 + fringe, -h / 2, w, h, 8);
                    ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';

                    // 2. Motion streak / smear with a neon rim glow
                    const smearX = 15 * intensity / item.squash;
                    ctx.shadowBlur = 25 * intensity;
                    ctx.shadowColor = `rgba(0, 225, 255, ${intensity * 0.6})`;
                    ctx.globalAlpha = item.alpha * 0.4;
                    ctx.drawImage(img, -w / 2 - smearX, -h / 2, w + smearX * 2, h);
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';
                    ctx.globalAlpha = item.alpha;
                }

                // Masking card clip container (rounded card frames)
                ctx.beginPath();
                ctx.roundRect(-w / 2, -h / 2, w, h, 8);
                ctx.clip();
                ctx.drawImage(img, -w / 2, -h / 2, w, h);

                // Darken the reverse side so back-row cards read as the far wall
                if (!item.isFrontRow) {
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.fillRect(-w / 2, -h / 2, w, h);
                }
                ctx.restore();

                // Screen-space bounds for click hit-testing
                const halfW = (w / 2) * item.scale * item.squash;
                const halfH = (h / 2) * item.scale;
                drawnItems.push({
                    slot: item.slot,
                    index: item.index,
                    left: item.x - halfW,
                    right: item.x + halfW,
                    top: item.y - halfH,
                    bottom: item.y + halfH
                });
            });
        }

        // Initialize execution loop
        requestAnimationFrame(animate);
    </script>
</body>
</html>
